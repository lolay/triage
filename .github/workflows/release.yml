# Release pipeline for lolay/triage.
#
# Triggers:
#   push tag vX.Y.Z  — normal release path (goreleaser + publish + floating tags)
#   workflow_dispatch — bump the version, commit the CHANGELOG, tag, and push;
#                       the tag push then re-triggers this workflow on the tag ref
#                       to run the full publish pipeline (needs RELEASE_TAG_PAT).
#
# Remote pushes happen LAST and in order so a partial failure never leaves one
# marketplace/channel updated while another is not:
#   Phase 1 — goreleaser: build + validate all artifacts (no remote until green)
#   Phase 2 — GitHub Release assets (inside goreleaser)
#   Phase 3a — Homebrew tap + Scoop bucket commits (after release URLs exist)
#   Phase 3b — floating tags vX.Y / vX (this workflow, last)
#
# See specs/releasing.md for the full maintainer guide.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      level:
        description: 'SemVer bump level'
        type: choice
        required: true
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: triage-release-bot
  GIT_AUTHOR_EMAIL: triage-release-bot@lolay.com
  GIT_COMMITTER_NAME: triage-release-bot
  GIT_COMMITTER_EMAIL: triage-release-bot@lolay.com

jobs:
  cut-release:
    name: bump + tag
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      # Use RELEASE_TAG_PAT so the tag push below re-triggers this workflow on
      # the tag ref. GITHUB_TOKEN-pushed tags do not trigger push events (GitHub
      # prevents the recursion), but a PAT does — same pattern as lolay/nowline.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_PAT }}

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          LATEST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          VER="${LATEST#v}"
          MAJOR="${VER%%.*}"
          MINOR="${VER#*.}"; MINOR="${MINOR%%.*}"
          PATCH="${VER##*.}"
          case "${{ inputs.level }}" in
            patch) PATCH=$((PATCH + 1)) ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${LATEST} → v${NEW} (${{ inputs.level }})"

      - name: Update CHANGELOG
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s/## \[Unreleased\]/## [${VERSION}] - ${TODAY}/" CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "chore: release ${VERSION}"

      - name: Tag and push
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          git tag "v${VERSION}"
          git push origin HEAD
          git push origin "v${VERSION}"

  release:
    name: goreleaser release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Homebrew formula
        if: ${{ !contains(github.ref, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          scripts/publish-formula.sh "$VERSION" dist

      - name: Publish Scoop manifest
        if: ${{ !contains(github.ref, '-') }}
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          scripts/publish-scoop.sh "$VERSION" dist

  promote-floating-tags:
    name: promote floating tags
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref, '-')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Force-push floating major/minor tags
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          git config user.name "triage-release-bot"
          git config user.email "triage-release-bot@lolay.com"

          # Moving minor pointer (e.g. v0.3 -> latest 0.3.x).
          git tag --force "v${MINOR}"
          git push --force origin "v${MINOR}"

          # Moving major pointer (e.g. v0 -> latest 0.x).
          git tag --force "v${MAJOR}"
          git push --force origin "v${MAJOR}"
