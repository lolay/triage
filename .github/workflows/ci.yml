# CI gate: humans, agents, and CI all run `make ci`, so a green local gate
# matches CI. A separate job validates the goreleaser config via `goreleaser
# check` (no publish — release wiring is in release.yml, m5).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: build · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      # Verify dependencies on disk match go.sum before building anything.
      - name: go mod verify
        run: go mod verify

      # Install golangci-lint + actionlint at the Makefile pins (the only
      # pins). Locally: `make install-tools` (or `make init INSTALL_PACKAGES=1`).
      # `make lint` fails hard if the binary is missing.
      - name: Install pinned tools
        run: make install-tools

      - name: make ci
        run: make ci

      # Scan dependencies for known vulnerabilities (govulncheck wired as a
      # go.mod tool dependency; runs on every push and PR).
      - name: make vuln
        run: make vuln

  aw-check:
    name: agentic workflows compiled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Recompiles .github/workflows/agent-*.md with the pinned gh-aw
      # (GH_AW_VERSION) and fails if any .lock.yml is stale.
      - name: make aw-check
        run: make aw-check

  # Every released os/arch pair runs natively, not just cross-compiles.
  # linux/amd64 is covered by `ci` above. The windows/amd64 label stays
  # "windows" so the existing required check name doesn't change.
  ci-native:
    name: build · test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: windows-11-arm
            label: windows-arm64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  release-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      # goreleaser is pinned by GORELEASER_VERSION in the Makefile.
      - name: Read goreleaser pin
        id: pins
        run: echo "goreleaser=$(make -s print-GORELEASER_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ steps.pins.outputs.goreleaser }}
          args: check

  action-dogfood:
    name: triage-action dogfood
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      - name: Install golangci-lint
        run: make install-tools

      - name: Run released triage-action
        uses: lolay/triage-action@v0
        with:
          profile: ci
          json: true
