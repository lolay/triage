# CI gate: humans, agents, and CI all run `make ci`, so a green local gate
# matches CI. A separate job validates the goreleaser config via `goreleaser
# check` (no publish — release wiring is in release.yml, m5).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: build · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      # Verify dependencies on disk match go.sum before building anything.
      - name: go mod verify
        run: go mod verify

      # Install golangci-lint at the version pinned in GOLANGCI_LINT_VERSION
      # (Makefile). Locally: `make init INSTALL_PACKAGES=1` installs it.
      # `make lint` fails hard if the binary is missing — keep these in sync.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: make ci
        run: make ci

      # Scan dependencies for known vulnerabilities (govulncheck wired as a
      # go.mod tool dependency; runs on every push and PR).
      - name: make vuln
        run: make vuln

  ci-windows:
    name: build · test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  release-check:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

  action-dogfood:
    name: triage-action dogfood
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.mod

      - name: Run released triage-action
        uses: lolay/triage-action@v0
        with:
          profile: ci
          json: true
