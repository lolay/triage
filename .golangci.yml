# golangci-lint configuration (v2 schema). Baseline for the triage CLI.
#
# Kept intentionally small in m1: the v2 "standard" set (errcheck, govet,
# ineffassign, staticcheck, unused) plus misspell, with gofmt/goimports as
# formatters. `make lint` runs this when golangci-lint is installed; CI always
# runs it. Tighten as the codebase grows.
version: "2"

linters:
  default: standard
  enable:
    - misspell
    - modernize
    - errorlint
    - revive
    - bodyclose
    - gosec
  settings:
    govet:
      enable-all: true
  exclusions:
    rules:
      # gosec targets production attack surface. Test files write fixtures to
      # t.TempDir() with 0644/0755 and read golden files by computed paths
      # (G301/G302/G304/G306) — test scaffolding, not a security boundary — so
      # gosec is scoped out of *_test.go. Production G204/G304 sites are
      # suppressed inline with per-line justifications instead.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lolay/triage
