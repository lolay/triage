# yaml-language-server: $schema=schema/triage.schema.json
# triage.yaml — triage checks its own dev environment (dogfooding).
#
# Run `make doctor` (→ `triage`) in this repo and you should get a clean
# board on a set-up machine. `make doctor MODE=release` additionally checks the
# tooling needed to cut a release.
#
# Canonical location: repo root. See specs/config.md for the full config reference and
# examples/ for (fictional) configs exercising every feature.
#
# Profile hierarchy:
#   base    — git + go (used by CI runners and as the foundation for everything)
#   default — extends base, adds golangci-lint (full local dev environment)
#   release — extends default, adds release toolchain
#   ci      — extends base (not default), adds gh; no dev-only tools

base:
  - group: Core
    items:
      - tool: git
        hint: https://git-scm.com
  - group: Toolchain
    items:
      - tool: go
        version_from: .go-version
        hint: https://go.dev/dl

default:
  extends: [base]
  add:
    - group: Lint
      items:
        - tool: golangci-lint
          hint: run 'make init INSTALL_PACKAGES=1' to install

release:
  extends: [default]
  add:
    - group: Release
      items:
        - tool: gh
          hint: https://cli.github.com
        - tool: goreleaser
          hint: brew install goreleaser
        - tool: mandoc
          hint: brew install mandoc

ci:
  extends: [default]
  add:
    - group: CI
      items:
        - tool: gh
          hint: https://cli.github.com
