# yaml-language-server: $schema=../schema/triage.schema.json
# vitalink-api — Go service (fictional).
#
# Exercises: include (shared base), version_from (read .go-version), profile
# inheritance, and a deploy auth/session check (logged in AND not expired).

include:
  - vitalink-base.yaml

default:
  - group: Toolchain
    items:
      - tool: go
        version_from: .go-version
        hint: https://go.dev/dl

release:
  extends: [default]
  add:
    - group: Deploy
      items:
        - tool: gcloud
          hint: https://cloud.google.com/sdk/docs/install
        - command: gcloud auth print-access-token
          label: gcloud logged in (token valid, not expired)
          platform: [macos, linux]
          hint: gcloud auth login
