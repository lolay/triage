# yaml-language-server: $schema=../schema/triage.schema.json
# vitalink-web — Node/pnpm web app (fictional).
#
# Exercises: version minimum + recommended_from (.nvmrc), one_of (pnpm OR npm),
# severity: warn, and firebase + gcloud auth/session checks in the release
# profile.

include:
  - vitalink-base.yaml

default:
  - group: Toolchain
    items:
      # Supports Node 22 (warn below .nvmrc), errors below it.
      - tool: node
        version: ">=22"
        recommended_from: .nvmrc
        hint: https://nodejs.org (see .nvmrc)
      - one_of: [pnpm, npm]
        hint: corepack enable && corepack prepare pnpm@latest --activate
  - group: Lint
    items:
      - tool: biome
        severity: warn
        hint: pnpm add -D @biomejs/biome

release:
  extends: [default]
  add:
    - group: Deploy
      items:
        - tool: firebase
          hint: npm install -g firebase-tools
        - command: firebase login:list
          label: firebase authenticated
          contains: "@"
          hint: firebase login
        - tool: gcloud
          hint: https://cloud.google.com/sdk/docs/install
        - command: gcloud auth print-access-token
          label: gcloud logged in (token valid, not expired)
          platform: [macos, linux]
          hint: gcloud auth login
