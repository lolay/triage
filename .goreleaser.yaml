# goreleaser configuration (v2 schema) — m5 release pipeline.
#
# Build matrix (darwin/linux × amd64/arm64), GitHub release assets, Homebrew tap
# commit, and man pages. Publishing order inside `goreleaser release`:
#   1. Build + archive + checksum (local, no remote)
#   2. GitHub Release upload (lolay/triage)
#   3. Homebrew tap commit (lolay/homebrew-tap) — after release URLs exist
# Floating tags (v0.3, v0) are promoted in .github/workflows/release.yml last.
version: 2

project_name: triage

before:
  hooks:
    - go mod tidy

builds:
  - id: triage
    main: .
    binary: triage
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/lolay/triage/internal/buildinfo.Version={{ .Version }}
      - -X github.com/lolay/triage/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/lolay/triage/internal/buildinfo.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: triage
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: man/triage.1
        dst: triage.1
      - src: man/triage.5
        dst: triage.5

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc

release:
  github:
    owner: lolay
    name: triage
  extra_files:
    - glob: man/triage.1
    - glob: man/triage.5

homebrew_casks:
  - name: triage
    repository:
      owner: lolay
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/lolay/triage"
    description: "The environment doctor — declarative prerequisite checks"
    commit_author:
      name: triage-release-bot
      email: triage-release-bot@lolay.com
    commit_msg_template: "triage {{ .Version }}"
    skip_upload: "auto"
    manpages:
      - man/triage.1
      - man/triage.5
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/triage"]
          end
